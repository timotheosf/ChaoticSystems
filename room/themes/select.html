<script>
document.addEventListener("DOMContentLoaded", function() {
    // Procura o ícone circle-half na barra superior
    const icone = document.querySelector('.navbar-nav .bi-circle-half');
    if (!icone) return;
    
    // Pega o link (<a>) que envolve o ícone
    const botaoNosso = icone.closest('a');
    
    // Pega o botão invisível original do Quarto
    const botaoNativo = document.querySelector(".quarto-color-scheme-toggle");

    if (botaoNosso && botaoNativo) {
        botaoNosso.addEventListener("click", function(e) {
            e.preventDefault();
            botaoNativo.click(); // Alterna o tema instantaneamente!
        });
    }
});
</script>
